{% set tee = "M30 15 L42 10 Q50 17 58 10 L70 15 L86 31 L75 41 L68 35 L68 88 L32 88 L32 35 L25 41 L14 31 Z" %}
{% set mono = "ui-monospace,Consolas,monospace" %}
{% macro thumb(kind) %}
<svg viewBox="0 0 320 200" role="img" aria-label="{{ kind }} illustration">
  <rect width="320" height="200" fill="#FAF9F7"/>
  {% if kind == 'family' %}
    <g transform="translate(108 22) scale(1.05)"><path d="{{ tee }}" fill="none" stroke="#1D1F24" stroke-width="1.6" stroke-dasharray="4 3"/></g>
    <text x="24" y="34" font-family="{{ mono }}" font-size="11" fill="#67645D">TS-1000</text>
    <text x="24" y="182" font-family="{{ mono }}" font-size="11" fill="#2E4A7D">/adid/3f2b9c1e-…</text>
  {% elif kind == 'variant' %}
    {% for c in [('#2E4A7D','navy_m'),('#C9B48E','sand_l'),('#FFFFFF','white_xs')] %}
    <g transform="translate({{ 22 + loop.index0 * 96 }} 34) scale(.85)"><path d="{{ tee }}" fill="{{ c[0] }}" stroke="#D6D2CB"/></g>
    <text x="{{ 64 + loop.index0 * 96 }}" y="150" text-anchor="middle" font-family="{{ mono }}" font-size="11" fill="#1D1F24">{{ c[1] }}</text>
    {% endfor %}
    <text x="24" y="182" font-family="{{ mono }}" font-size="11" fill="#2E4A7D">/adid/3f2b…/white_xs</text>
  {% elif kind == 'instance' %}
    <g transform="translate(70 30) scale(1.1)"><path d="{{ tee }}" fill="#FFFFFF" stroke="#D6D2CB"/></g>
    <path d="M178 66 Q196 60 204 74" fill="none" stroke="#1D1F24" stroke-width="1.2"/>
    <g transform="translate(196 72)"><path d="M6 0h40l6 6v58H0V6z" fill="#fff" stroke="#D6D2CB"/><g transform="translate(9 14) scale(1.35)" fill="#1D1F24">{% include "_qr_path.html" %}</g></g>
    <text x="24" y="182" font-family="{{ mono }}" font-size="11" fill="#2E4A7D">/adid/3f2b…/white_xs/9c41…</text>
  {% elif kind == 'adid' %}
    <g font-family="{{ mono }}" font-size="11">
      <rect x="120" y="26" width="80" height="28" rx="6" fill="#1D1F24"/><text x="160" y="44" text-anchor="middle" fill="#FAF9F7">family</text>
      <line x1="160" y1="54" x2="90" y2="96" stroke="#B9B4AB"/><line x1="160" y1="54" x2="230" y2="96" stroke="#B9B4AB"/>
      <rect x="50" y="96" width="80" height="28" rx="14" fill="#E2E7F0"/><text x="90" y="114" text-anchor="middle" fill="#2E4A7D">white_xs</text>
      <rect x="190" y="96" width="80" height="28" rx="14" fill="#E2E7F0"/><text x="230" y="114" text-anchor="middle" fill="#2E4A7D">navy_m</text>
      <line x1="90" y1="124" x2="90" y2="146" stroke="#B9B4AB"/>
      <rect x="50" y="146" width="80" height="26" rx="5" fill="#FAF9F7" stroke="#D6455A" stroke-dasharray="3 3"/><text x="90" y="163" text-anchor="middle" fill="#B83347">instance</text>
    </g>
  {% elif kind == 'cdm' %}
    <g font-family="{{ mono }}" font-size="11" fill="#1D1F24">
      <text x="24" y="34">{</text>
      <text x="36" y="54"><tspan fill="#67645D">"@id":</tspan> <tspan fill="#2E4A7D">".../adid/3f2b…/white_xs"</tspan></text>
      <text x="36" y="74"><tspan fill="#67645D">"fibreComposition":</tspan> "100% Cotton"</text>
      <text x="36" y="94"><tspan fill="#67645D">"countryOfOrigin":</tspan> "LK"</text>
      <text x="36" y="114"><tspan fill="#67645D">"careInstructions":</tspan> "30C wash"</text>
      <text x="36" y="134"><tspan fill="#67645D">"commodityCode":</tspan> "61091000"</text>
      <text x="24" y="154">}</text>
      <text x="24" y="182" fill="#67645D">54 fields · each traced to a clause</text>
    </g>
  {% elif kind == 'gateway' %}
    <g font-family="{{ mono }}" font-size="11">
      {% for src, dst, c in [('Fabric Compostion','fibreComposition','fuzzy'),('EAN13','gtin','alias'),('Col_K','commodityCode','value'),('Shade / Tone','colour','template')] %}
      <text x="24" y="{{ 42 + loop.index0 * 34 }}" fill="#1D1F24">{{ src }}</text>
      <line x1="140" y1="{{ 38 + loop.index0 * 34 }}" x2="168" y2="{{ 38 + loop.index0 * 34 }}" stroke="#D6455A" stroke-width="1.4"/>
      <path d="M164 {{ 34 + loop.index0 * 34 }} l5 4 -5 4" fill="none" stroke="#D6455A" stroke-width="1.4"/>
      <text x="176" y="{{ 42 + loop.index0 * 34 }}" fill="#2E4A7D">{{ dst }}</text>
      <text x="176" y="{{ 54 + loop.index0 * 34 }}" fill="#67645D" font-size="9">{{ c }}</text>
      {% endfor %}
      <text x="24" y="182" fill="#67645D">alias → fuzzy → semantic → value</text>
    </g>
  {% endif %}
</svg>
{% endmacro %}
