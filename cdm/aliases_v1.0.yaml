# ADIF alias vocabulary v1.0
#
# Maps manufacturer-side field names onto CDM fields for Stage 1 deterministic
# lookup. Every key must exist in cdm_v1.0.schema.json; the registry refuses to
# load otherwise (FR-3.6).
#
# SOURCING. These aliases are drawn from general apparel ERP, tech-pack and
# trade-documentation vocabulary — the naming conventions a garment
# manufacturer's own systems use. They are deliberately NOT derived from the
# held-out evaluation schemas, and this file is frozen BEFORE those schemas are
# constructed (project.md §11). Authoring aliases by looking at the schemas you
# will be scored against is the circularity D3 exists to prevent.
#
# Aliases are normalised with the same function as incoming headers, so
# separators, camelCase and capitalisation do not need separate entries:
# "Fabric_Composition", "fabricComposition" and "FABRIC COMPOSITION" all
# collapse to one key. List genuinely different WORDS, not spellings.

