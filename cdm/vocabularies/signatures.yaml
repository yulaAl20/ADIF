# Value signatures for Stage 4 (M6, FR-6.4).
#
# STARTER LIBRARY — extend it as the real CDM lands. Keys must be CDM field
# names; a key naming a field absent from the schema is rejected at load, the
# same guard as the alias vocabulary (FR-3.6).
#
# The vocabularies here are the SAME ones CDM validation uses for controlled-
# value checks (FR-10.2). Keeping one copy is deliberate: two copies drift, and
# a matcher that accepts a country code the validator then rejects is a very
# confusing bug to trace.
#
# ⚠ countryOfOrigin now carries all 249 officially-assigned ISO 3166-1 alpha-2
# codes, compiled 2026-10-06 from knowledge rather than from the ISO register.
# VERIFY it against the ISO Online Browsing Platform before the freeze and record
# the check in sources.md. The `colour` and `size` vocabularies ARE still starter
# subsets — extend them from your own data.

gtin:
  - kind: callable
    callable: gtin_check_digit          # GTIN-8/12/13/14 modulo-10
  - kind: regex
    pattern: '\d{8}|\d{12,14}'

productIdentifier:
  # A signature must DISCRIMINATE, not merely be satisfiable. The first draft
  # here was '[A-Za-z0-9][A-Za-z0-9/-]{2,19}', which matches almost any short
  # alphanumeric string — so the value stage fired on nearly every unmapped
  # column, inflating its apparent contribution in the ablation and generating
  # conflicts the resolver then had to undo. A style code is letters AND digits
  # with a separator: TSH-1001, DEN/3005.
  - kind: regex
    pattern: '[A-Za-z]{2,6}[-_/]\d{3,8}'

importerEori:
  # Minimum length raised to 8: the original allowed 'LK' itself to match,
  # which collided head-on with countryOfOrigin.
  - kind: regex
    case_sensitive: true        # without this, [A-Z]{2} matched "Knitwear"
    pattern: '[A-Z]{2}[A-Za-z0-9]{6,15}'

commodityCode:
  - kind: regex                          # HS/TARIC: 6, 8 or 10 digits
    pattern: '\d{6}(\d{2})?(\d{2})?'

countryOfOrigin:
  # ISO 3166-1 alpha-2, complete officially-assigned set (249 codes).
  # Compiled 2026-10-06. VERIFY against the ISO Online Browsing Platform before
  # the freeze (https://www.iso.org/obp/ui/#search/code/) and record the check in
  # sources.md: a code missing here becomes a silent validation failure, and a
  # code wrongly present silently accepts bad data.
  - kind: vocabulary
    vocabulary: [AD, AE, AF, AG, AI, AL, AM, AO, AQ, AR, AS, AT, AU, AW, AX, AZ, BA, BB, BD, 
                 BE, BF, BG, BH, BI, BJ, BL, BM, BN, BO, BQ, BR, BS, BT, BV, BW, BY, BZ, CA, 
                 CC, CD, CF, CG, CH, CI, CK, CL, CM, CN, CO, CR, CU, CV, CW, CX, CY, CZ, DE, 
                 DJ, DK, DM, DO, DZ, EC, EE, EG, EH, ER, ES, ET, FI, FJ, FK, FM, FO, FR, GA, 
                 GB, GD, GE, GF, GG, GH, GI, GL, GM, GN, GP, GQ, GR, GS, GT, GU, GW, GY, HK, 
                 HM, HN, HR, HT, HU, ID, IE, IL, IM, IN, IO, IQ, IR, IS, IT, JE, JM, JO, JP, 
                 KE, KG, KH, KI, KM, KN, KP, KR, KW, KY, KZ, LA, LB, LC, LI, LK, LR, LS, LT, 
                 LU, LV, LY, MA, MC, MD, ME, MF, MG, MH, MK, ML, MM, MN, MO, MP, MQ, MR, MS, 
                 MT, MU, MV, MW, MX, MY, MZ, NA, NC, NE, NF, NG, NI, NL, NO, NP, NR, NU, NZ, 
                 OM, PA, PE, PF, PG, PH, PK, PL, PM, PN, PR, PS, PT, PW, PY, QA, RE, RO, RS, 
                 RU, RW, SA, SB, SC, SD, SE, SG, SH, SI, SJ, SK, SL, SM, SN, SO, SR, SS, ST, 
                 SV, SX, SY, SZ, TC, TD, TF, TG, TH, TJ, TK, TL, TM, TN, TO, TR, TT, TV, TW, 
                 TZ, UA, UG, UM, US, UY, UZ, VA, VC, VE, VG, VI, VN, VU, WF, WS, YE, YT, ZA, 
                 ZM, ZW]
  - kind: vocabulary   # common full names, manufacturing and EU market countries
    vocabulary: ["sri lanka", india, bangladesh, pakistan, china, vietnam,
                 cambodia, indonesia, thailand, myanmar, turkey, germany,
                 france, italy, spain, netherlands, portugal, poland,
                 "united kingdom", "united states", bulgaria, romania, tunisia,
                 morocco, ethiopia, kenya, egypt, jordan, haiti, honduras,
                 guatemala, mexico, peru, brazil, taiwan, "south korea", japan]

fibreComposition:
  - kind: regex                          # "80% Cotton 20% Polyester", "100% Cotton"
    pattern: '(\d{1,3}\s*%\s*[A-Za-z][A-Za-z /-]*[,;]?\s*)+'

size:
  - kind: vocabulary                     # alpha sizing
    vocabulary: [xxs, xs, s, m, l, xl, xxl, xxxl, "2xl", "3xl", "4xl", os, "one size"]
  # Decimals removed: '\d{1,3}[./-]\d{1,3}' matched a weight of 0.180 and a
  # price of 3.10. Numeric garment sizes are whole numbers, optionally paired
  # for waist/leg.
  - kind: regex
    pattern: '\d{2,3}([/-]\d{2,3})?'

colour:
  - kind: vocabulary                     # STARTER SUBSET — extend from your data
    vocabulary: [black, white, navy, blue, red, green, grey, gray, beige, cream,
                 brown, pink, purple, orange, yellow, olive, khaki, maroon, teal,
                 charcoal, ecru, natural, ivory, burgundy, mustard, indigo]
  # The '#' is MANDATORY. Optional, this matched any six hex characters - and
  # an HS code like 610910 is six hex characters.
  - kind: regex
    pattern: '#[0-9A-Fa-f]{6}'

carbonFootprint:
  # The unit marker is MANDATORY. When it was optional this pattern matched any
  # number at all, so an HS code (610910) and a volume (0.0012) both scored as
  # carbon footprints. A numeric signature without a required unit is not a
  # signature - it is a type check wearing a signature's clothes.
  - kind: regex
    pattern: '\d+([.,]\d+)?\s*(kg\s*)?(co2e?|co2\s*eq|kgco2e?)'
